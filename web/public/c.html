<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared collection · ReelVault</title>
  <meta name="description" content="A collection of short videos shared from ReelVault.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101010">
  <link rel="icon" href="/assets/reelvault-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
  <script src="/c.js" defer></script>
</head>
<body>
  <nav class="site-nav collection-nav" aria-label="Main navigation"><a class="wordmark" href="/"><img src="/assets/reelvault-icon.svg" width="32" height="32" alt="">ReelVault</a><a href="https://github.com/wilymanhoward/ReelVault/releases">Get the app</a></nav>
  <header class="cover" id="cover">
    <div class="cover-inner">
      <p class="emoji" id="emoji" aria-hidden="true"></p>
      <h1 id="name">Loading…</h1>
      <p class="count" id="count"></p>
    </div>
  </header>

  <main>
    <p class="notice" id="notice" role="status" hidden></p>
    <ul class="frames" id="frames" aria-busy="true">
      <li class="frame skeleton"></li><li class="frame skeleton"></li><li class="frame skeleton"></li>
      <li class="frame skeleton"></li><li class="frame skeleton"></li><li class="frame skeleton"></li>
    </ul>
  </main>

  <footer>
    <p>Shared with ReelVault, an open-source Android app that keeps your saved TikToks, Reels and Shorts in one place.
      <a href="https://github.com/wilymanhoward/ReelVault">Get ReelVault on GitHub</a></p>
  </footer>
</body>
</html>
