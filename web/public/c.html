<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared collection · ReelVault</title>
  <meta name="description" content="A collection of short videos shared from ReelVault.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <script src="/c.js" defer></script>
</head>
<body>
  <header class="cover" id="cover">
    <div class="cover-inner">
      <p class="emoji" id="emoji" aria-hidden="true"></p>
      <h1 id="name">Loading…</h1>
      <p class="count" id="count"></p>
    </div>
  </header>

  <main>
    <p class="notice" id="notice" hidden></p>
    <ul class="frames" id="frames" aria-busy="true">
      <li class="frame skeleton"></li><li class="frame skeleton"></li><li class="frame skeleton"></li>
      <li class="frame skeleton"></li><li class="frame skeleton"></li><li class="frame skeleton"></li>
    </ul>
  </main>

  <footer>
    <p>Shared with ReelVault, an open-source Android app that keeps your saved TikToks, Reels and Shorts in one place.
      <a href="https://github.com/wilymanhoward/ReelVault">Get ReelVault on GitHub</a></p>
  </footer>
</body>
</html>
