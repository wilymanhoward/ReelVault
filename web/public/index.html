  <meta name="description" content="ReelVault keeps your saved TikToks, Reels, Shorts and more in one place on Android.">

  <main class="landing">
    <h1>Every saved video, one vault.</h1>
    <p>ReelVault is an open-source Android app for the short videos you save on TikTok, Instagram, YouTube,
